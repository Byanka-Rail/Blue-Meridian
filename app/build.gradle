plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bluemeridian.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bluemeridian.game'
        minSdk 29
        targetSdk 35
        versionCode 109235
        versionName '1.9.235'
    }

    // 개인 설치용 고정 서명 키 — 빌드할 때마다 키가 바뀌면 덮어쓰기 설치가 막힌다.
    // Play Store 배포용 키로 쓰지 말 것.
    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        sideload {
            storeFile file('bluemeridian-sideload.keystore')
            storePassword 'bluemeridian'
            keyAlias 'bluemeridian'
            keyPassword 'bluemeridian'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
