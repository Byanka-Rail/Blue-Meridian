name: Build BLUE MERIDIAN APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu 러너에는 Android SDK 가 이미 있다. 별도 액션 없이 그대로 쓴다 (setup-android 액션이 깨져서 바꿈).
      - name: Install Android platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || { echo "sdkmanager not found at $SDKM"; ls -la "$ANDROID_HOME" || true; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Bundle Three.js for offline play
        run: python3 tools/prepare_assets.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BLUE_MERIDIAN_APP_v1.9.235.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_MERIDIAN_APP_v1.9.235_APK
          path: BLUE_MERIDIAN_APP_v1.9.235.apk
