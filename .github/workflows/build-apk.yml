name: Build BLUE MERIDIAN APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Bundle Three.js for offline play
        run: python3 tools/prepare_assets.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BLUE_MERIDIAN_v1.9.227.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_MERIDIAN_v1.9.227_APK
          path: BLUE_MERIDIAN_v1.9.227.apk
